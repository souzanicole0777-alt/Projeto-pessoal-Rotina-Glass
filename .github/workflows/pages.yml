name: Publicar Rotina Glass para iPhone

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build-site.py'
      - 'scripts/sw-template.js'
      - 'rotina-glass-financas.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar e verificar o endereço
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Conferir edição web e JavaScript
        run: |
          python3 scripts/build-site.py
          git diff --exit-code -- site
          node --check site/sw.js
          node --check site/web-app.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Preparar arquivos públicos
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Publicar aplicativo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Conferir endereço publicado
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 "$SITE_URL" --output /tmp/rotina-glass-publicado.html
          python3 - <<'PY'
          from pathlib import Path
          expected = Path('site/index.html').read_bytes()
          actual = Path('/tmp/rotina-glass-publicado.html').read_bytes()
          if actual != expected:
              raise SystemExit('O endereço ainda não retornou a versão publicada.')
          print('Endereço HTTPS conferido: o HTML publicado é idêntico ao testado.')
          PY
